<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/lista-produtos" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Novo Produto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="vp-page-content">
  <div class="form-header animate-fade-in-up">
    <div class="form-icon">📦</div>
    <h2>Cadastro de Produto</h2>
    <p>Adicione um novo produto ao catálogo</p>
  </div>

  <div class="vp-form animate-fade-in-up animate-delay-1">

    <!-- Nome -->
    <div class="field-group">
      <label class="field-label">Nome do Produto *</label>
      <div class="field-input-wrap">
        <ion-icon name="cube-outline" class="field-icon"></ion-icon>
        <ion-input
          id="campo-nome-produto"
          type="text"
          placeholder="Ex: Camiseta Branca M"
          [(ngModel)]="produto.nome"
          class="vp-field-input">
        </ion-input>
      </div>
    </div>

    <!-- Código de Barras -->
    <div class="field-group">
      <label class="field-label">Código de Barras *</label>
      <div class="field-input-wrap">
        <ion-icon name="pricetag-outline" class="field-icon"></ion-icon>
        <ion-input
          id="campo-codigo-produto"
          type="text"
          placeholder="Ex: 7891234567890"
          [(ngModel)]="produto.codigo_barras"
          inputmode="numeric"
          class="vp-field-input">
        </ion-input>
      </div>
    </div>

    <!-- Preço e Estoque lado a lado -->
    <div class="two-cols">
      <div class="field-group">
        <label class="field-label">Preço (R$) *</label>
        <div class="field-input-wrap">
          <ion-icon name="pricetag-outline" class="field-icon"></ion-icon>
          <ion-input
            id="campo-preco-produto"
            type="number"
            placeholder="0,00"
            [(ngModel)]="produto.preco"
            inputmode="decimal"
            min="0"
            step="0.01"
            class="vp-field-input">
          </ion-input>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Estoque *</label>
        <div class="field-input-wrap">
          <ion-icon name="layers-outline" class="field-icon"></ion-icon>
          <ion-input
            id="campo-estoque-produto"
            type="number"
            placeholder="0"
            [(ngModel)]="produto.estoque"
            inputmode="numeric"
            min="0"
            class="vp-field-input">
          </ion-input>
        </div>
      </div>
    </div>

    <!-- Descrição -->
    <div class="field-group">
      <label class="field-label">Descrição</label>
      <div class="field-input-wrap textarea-wrap">
        <ion-icon name="document-text-outline" class="field-icon" style="align-self: flex-start; margin-top: 16px;"></ion-icon>
        <ion-input
          id="campo-descricao-produto"
          type="text"
          placeholder="Descrição opcional do produto..."
          [(ngModel)]="produto.descricao"
          class="vp-field-input">
        </ion-input>
      </div>
    </div>

    <!-- Erro -->
    <div class="erro-msg animate-fade-in-up" *ngIf="erro">
      <span>⚠️ {{ erro }}</span>
    </div>

    <!-- Botão Salvar -->
    <ion-button
      id="btn-salvar-produto"
      expand="block"
      class="btn-salvar"
      (click)="salvar()"
      [disabled]="salvando">
      <ion-spinner *ngIf="salvando" name="crescent" slot="start"></ion-spinner>
      <ion-icon *ngIf="!salvando" name="save-outline" slot="start"></ion-icon>
      {{ salvando ? 'Salvando...' : 'Cadastrar Produto' }}
    </ion-button>
  </div>
</ion-content>
